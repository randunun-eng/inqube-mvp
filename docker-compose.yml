version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: inqube-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
  api:
    build: ./backend
    container_name: inqube-api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    expose:
      - "8000"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-inqube_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-inqube_db}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-inqube_user}:${POSTGRES_PASSWORD:-changeme}@db/${POSTGRES_DB:-inqube_db}
      - REDIS_URL=redis://redis:6379/0
      - MQTT_BROKER_HOST=mqtt
      - MQTT_BROKER_PORT=1883
    depends_on:
      - db
      - redis
      - mqtt

  db:
    image: timescale/timescaledb:latest-pg15
    container_name: inqube-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-inqube_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-inqube_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: inqube-redis
    ports:
      - "6379:6379"

  mqtt:
    image: eclipse-mosquitto:2
    container_name: inqube-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mqtt/config:/mosquitto/config
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log

  n8n:
    image: n8nio/n8n:latest
    container_name: inqube-n8n
    restart: always
    # ports:
    #   - "5678:5678"  <-- Removed to avoid conflict, access via Nginx
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-password}
      - N8N_HOST=${DOMAIN_NAME:-eurovolt.online}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - NODE_ENV=production
      - WEBHOOK_URL=http://${DOMAIN_NAME:-eurovolt.online}/n8n/
      - N8N_PATH=/n8n/
      - EXECUTIONS_PROCESS=main
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  mqtt_data:
  mqtt_log:
  n8n_data:


